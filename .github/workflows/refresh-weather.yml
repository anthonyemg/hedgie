name: Refresh weather data

on:
  schedule:
    # 14:00 UTC ≈ 6-7am in Seattle (depending on daylight saving) — once
    # each morning, so the site never calls the weather API on page load.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/fetch-weather.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet || git commit -m "Refresh weather data [automated]"
          git push
