name: Deploy site

on:
  push:
    branches: [main]
  # Bot commits from refresh-events.yml use the default GITHUB_TOKEN, whose
  # pushes don't trigger `on: push` workflows (loop prevention) — so chain
  # off that workflow's completion instead to keep the deployed data fresh.
  workflow_run:
    workflows: ["Refresh events data", "Refresh weather data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p dist
          cp -r src/. dist/
          cp -r data dist/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
