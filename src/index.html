<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hedgie</title>
<style>
  body {
    margin: 0;
    padding: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #222;
    background: #fff;
    max-width: 40rem;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0.5rem 0 0.25rem;
  }
  #meta {
    color: #666;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    padding: 0.75rem 0;
    border-bottom: 1px solid #ddd;
  }
  .name {
    font-weight: bold;
    text-decoration: none;
    color: #06c;
  }
  .free {
    color: #080;
    font-weight: bold;
    font-size: 0.8rem;
    margin-left: 0.4rem;
  }
  .facts {
    font-size: 0.85rem;
    color: #444;
    margin: 0.2rem 0;
  }
  .description {
    margin: 0.3rem 0 0;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  select {
    font-size: 1rem;
    padding: 0.3rem;
  }
  .controls label {
    font-size: 0.95rem;
  }
</style>
</head>
<body>
  <h1>Hedgie</h1>
  <div id="meta">Loading&hellip;</div>
  <div class="controls">
    <select id="category-filter">
      <option value="">All categories</option>
    </select>
    <select id="date-filter">
      <option value="today" selected>Today</option>
      <option value="week">This week</option>
      <option value="">This month</option>
    </select>
  </div>
  <ul id="events"></ul>

<script>
// date_text is a free-text string like "September 1, 2026",
// "September 2 - Oct. 3, 2026", or "September 17 & 23, 2026" (discrete
// dates, not a range) — parsed just well enough to answer "is this event
// happening today?" for the today-only filter. Trailing time-of-day notes
// like "(8 p.m.)" are stripped before parsing.
const MONTHS = {
  jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2,
  apr: 3, april: 3, may: 4, jun: 5, june: 5, jul: 6, july: 6,
  aug: 7, august: 7, sep: 8, sept: 8, september: 8,
  oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11,
};

function parseMonth(token) {
  const key = token.toLowerCase().replace(/\./g, '');
  return Object.prototype.hasOwnProperty.call(MONTHS, key) ? MONTHS[key] : null;
}

function parseDatePart(text) {
  let match = text.match(/^([A-Za-z.]+)\s+(\d{1,2})(?:,\s*(\d{4}))?$/);
  if (match) {
    const month = parseMonth(match[1]);
    if (month === null) return null;
    return { month, day: parseInt(match[2], 10), year: match[3] ? parseInt(match[3], 10) : null };
  }
  match = text.match(/^(\d{1,2})(?:,\s*(\d{4}))?$/);
  if (match) return { month: null, day: parseInt(match[1], 10), year: match[2] ? parseInt(match[2], 10) : null };
  return null;
}

function resolveParts(parts) {
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < parts.length; i++) {
      const donor = parts[i + 1] || parts[i - 1];
      if (!donor) continue;
      if (parts[i].month === null) parts[i].month = donor.month;
      if (parts[i].year === null) parts[i].year = donor.year;
    }
  }
  return parts.every((p) => p.month !== null && p.year !== null) ? parts : null;
}

function parseDateInfo(dateText) {
  if (!dateText) return null;
  const cleaned = dateText.replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim();

  if (cleaned.includes("&")) {
    const parts = cleaned.split(/\s*&\s*/).map(parseDatePart);
    if (parts.some((p) => !p)) return null;
    const resolved = resolveParts(parts);
    if (!resolved) return null;
    return { type: "discrete", dates: resolved.map((p) => new Date(p.year, p.month, p.day)) };
  }

  const parts = cleaned.split(/\s*-\s*/).map(parseDatePart);
  if (parts.some((p) => !p)) return null;
  let [start, end] = parts.length === 1 ? [parts[0], parts[0]] : parts;

  if (start.month === null) start.month = end.month;
  if (end.month === null) end.month = start.month;
  if (start.month === null || end.month === null) return null;
  if (start.year === null && end.year !== null) start.year = start.month > end.month ? end.year - 1 : end.year;
  if (end.year === null && start.year !== null) end.year = end.month < start.month ? start.year + 1 : start.year;
  if (start.year === null || end.year === null) return null;

  return {
    type: "range",
    start: new Date(start.year, start.month, start.day),
    end: new Date(end.year, end.month, end.day),
  };
}

// True if the event has any day in common with [windowStart, windowEnd]
// (inclusive). Used for both "Today" (a single-day window) and "This week".
function isEventInWindow(dateText, windowStart, windowEnd) {
  const info = parseDateInfo(dateText);
  if (!info) return false;
  if (info.type === "discrete") {
    return info.dates.some((d) => d >= windowStart && d <= windowEnd);
  }
  return info.start <= windowEnd && info.end >= windowStart;
}

async function main() {
  const res = await fetch('data/events.json');
  const data = await res.json();
  const meta = document.getElementById('meta');
  const list = document.getElementById('events');
  const filter = document.getElementById('category-filter');
  const dateFilter = document.getElementById('date-filter');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  // "This week" = today through the coming Saturday (weeks run Sun–Sat),
  // i.e. the rest of the current calendar week, not days already past.
  const endOfWeek = new Date(today);
  endOfWeek.setDate(today.getDate() + (6 - today.getDay()));

  meta.textContent = `${data.items.length} events · updated ${new Date(data.generated_at).toLocaleDateString()}`;

  const categories = [...new Set(data.items.map(e => e.category).filter(Boolean))].sort();
  for (const cat of categories) {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    filter.appendChild(opt);
  }

  function render(events) {
    list.innerHTML = '';
    for (const event of events) {
      const li = document.createElement('li');

      const link = document.createElement('a');
      link.className = 'name';
      link.href = event.source_url || '#';
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = event.name;
      li.appendChild(link);

      if (event.is_free) {
        const free = document.createElement('span');
        free.className = 'free';
        free.textContent = 'FREE';
        li.appendChild(free);
      }

      const facts = document.createElement('div');
      facts.className = 'facts';
      const location = [event.neighborhood, event.distance_from_downtown].filter(Boolean).join(' — ');
      facts.textContent = [event.date_text, location, event.category].filter(Boolean).join(' · ');
      li.appendChild(facts);

      if (event.description) {
        const desc = document.createElement('div');
        desc.className = 'description';
        desc.textContent = event.description;
        li.appendChild(desc);
      }

      list.appendChild(li);
    }
  }

  function applyFilters() {
    let events = data.items;
    if (filter.value) events = events.filter(e => e.category === filter.value);
    if (dateFilter.value === 'today') {
      events = events.filter(e => isEventInWindow(e.date_text, today, today));
    } else if (dateFilter.value === 'week') {
      events = events.filter(e => isEventInWindow(e.date_text, today, endOfWeek));
    }
    render(events);
  }

  applyFilters();

  filter.addEventListener('change', applyFilters);
  dateFilter.addEventListener('change', applyFilters);
}

main().catch(err => {
  document.getElementById('meta').textContent = 'Failed to load events: ' + err.message;
});
</script>
</body>
</html>
