<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seattle Things To Do</title>
<style>
  body {
    margin: 0;
    padding: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #222;
    background: #fff;
    max-width: 40rem;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0.5rem 0 0.25rem;
  }
  #meta {
    color: #666;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    padding: 0.75rem 0;
    border-bottom: 1px solid #ddd;
  }
  .name {
    font-weight: bold;
    text-decoration: none;
    color: #06c;
  }
  .free {
    color: #080;
    font-weight: bold;
    font-size: 0.8rem;
    margin-left: 0.4rem;
  }
  .facts {
    font-size: 0.85rem;
    color: #444;
    margin: 0.2rem 0;
  }
  .description {
    margin: 0.3rem 0 0;
  }
  select {
    font-size: 1rem;
    padding: 0.3rem;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <h1>Seattle Things To Do</h1>
  <div id="meta">Loading&hellip;</div>
  <select id="category-filter">
    <option value="">All categories</option>
  </select>
  <ul id="events"></ul>

<script>
async function main() {
  const res = await fetch('data/events.json');
  const data = await res.json();
  const meta = document.getElementById('meta');
  const list = document.getElementById('events');
  const filter = document.getElementById('category-filter');

  meta.textContent = `${data.events.length} events · updated ${new Date(data.scraped_at).toLocaleDateString()}`;

  const categories = [...new Set(data.events.map(e => e.category).filter(Boolean))].sort();
  for (const cat of categories) {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    filter.appendChild(opt);
  }

  function render(events) {
    list.innerHTML = '';
    for (const event of events) {
      const li = document.createElement('li');

      const link = document.createElement('a');
      link.className = 'name';
      link.href = event.source_url || '#';
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = event.name;
      li.appendChild(link);

      if (event.is_free) {
        const free = document.createElement('span');
        free.className = 'free';
        free.textContent = 'FREE';
        li.appendChild(free);
      }

      const facts = document.createElement('div');
      facts.className = 'facts';
      const location = [event.neighborhood, event.distance_from_downtown].filter(Boolean).join(' — ');
      facts.textContent = [event.date_text, location, event.category].filter(Boolean).join(' · ');
      li.appendChild(facts);

      if (event.description) {
        const desc = document.createElement('div');
        desc.className = 'description';
        desc.textContent = event.description;
        li.appendChild(desc);
      }

      list.appendChild(li);
    }
  }

  render(data.events);

  filter.addEventListener('change', () => {
    const value = filter.value;
    render(value ? data.events.filter(e => e.category === value) : data.events);
  });
}

main().catch(err => {
  document.getElementById('meta').textContent = 'Failed to load events: ' + err.message;
});
</script>
</body>
</html>
